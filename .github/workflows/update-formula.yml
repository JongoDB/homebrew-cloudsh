name: Update Formula

on:
  repository_dispatch:
    types: [update-formula]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update formula version and SHA
        env:
          VERSION: ${{ github.event.client_payload.version }}
          SHA: ${{ github.event.client_payload.sha256 }}
        run: |
          if [[ -z "$VERSION" || -z "$SHA" ]]; then
            echo "Error: version and sha256 are required"
            exit 1
          fi

          echo "Updating formula to v${VERSION} (sha: ${SHA})"

          sed -i "s|url \"https://github.com/JongoDB/cloudsh/archive/v.*\.tar\.gz\"|url \"https://github.com/JongoDB/cloudsh/archive/v${VERSION}.tar.gz\"|" Formula/cloudsh.rb
          sed -i "s|sha256 \".*\"|sha256 \"${SHA}\"|" Formula/cloudsh.rb

          echo "Updated formula:"
          head -6 Formula/cloudsh.rb

      - name: Commit and push
        env:
          VERSION: ${{ github.event.client_payload.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/cloudsh.rb
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "formula: bump cloudsh to v${VERSION}"
          git push
